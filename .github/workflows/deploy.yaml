name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, ARM64, lab-app]
    steps:
      - name: Check out the successful commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy on the app host
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: latest
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          IMAGE_PREFIX="$image_prefix" IMAGE_TAG="$IMAGE_TAG" docker compose -f deploy/compose.app.yaml pull
          IMAGE_PREFIX="$image_prefix" IMAGE_TAG="$IMAGE_TAG" docker compose -f deploy/compose.app.yaml up -d --remove-orphans
          response=$(curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1/version)
          printf '%s\n' "$response" | jq -e --arg sha "$EXPECTED_SHA" '.git_sha == $sha' >/dev/null
